name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — format, analyze, test, build web
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Verificar formato
        # Deuda histórica: hay archivos fuera de formato en main.
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Ejecutar tests
        run: flutter test

      - name: Compilar Web release
        run: flutter build web --release

      - name: Resumen Flutter
        run: |
          echo "### Flutter CI (sin deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- flutter test + build web --release" >> "$GITHUB_STEP_SUMMARY"

  functions:
    name: Functions — lint y tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Resumen Functions
        run: |
          echo "### Functions CI (sin deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run lint + node --test" >> "$GITHUB_STEP_SUMMARY"
          echo "- **No** firebase deploy" >> "$GITHUB_STEP_SUMMARY"

  firestore-rules:
    name: Firestore Rules — emulador
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/firestore_rules/package-lock.json

      - name: Configurar Java (emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar deps de tests Rules
        working-directory: test/firestore_rules
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ejecutar tests con emulador
        run: |
          firebase emulators:exec --only firestore --project demo-vicunha-rules \
            "npm --prefix test/firestore_rules test"

      - name: Resumen Rules
        run: |
          echo "### Firestore Rules CI (sin deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Emulator + node --test" >> "$GITHUB_STEP_SUMMARY"
          echo "- **No** deploy de rules/hosting/functions" >> "$GITHUB_STEP_SUMMARY"
