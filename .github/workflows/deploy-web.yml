name: Deploy Web Firebase

# Deploy de Hosting únicamente, bajo demanda.
# No se dispara en push a main. Firestore Rules tiene workflow aparte.
on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Web y deploy Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verificar secret de Firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Falta el secret FIREBASE_SERVICE_ACCOUNT en GitHub (Settings > Secrets and variables > Actions)."
            echo "Use el JSON de service account del proyecto vicunha-calculadora-neps."
            exit 1
          fi

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar Web release
        run: flutter build web --release

      - name: Autenticar en Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.22.2

      - name: Desplegar Hosting (Web)
        id: deploy_hosting
        run: |
          set +e
          OUTPUT=$(firebase deploy \
            --only hosting \
            --project vicunha-calculadora-neps \
            --non-interactive 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "is the current active version"; then
              echo "Hosting ya tenia esta version activa; despliegue considerado exitoso."
              exit 0
            fi
            echo "::error::Fallo el despliegue de Hosting."
            exit "$CODE"
          fi

      - name: Resumen del despliegue
        run: |
          echo "### Hosting desplegado (manual)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Web:** https://vicunha-calculadora-neps.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Proyecto:** vicunha-calculadora-neps" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hosting:** ${{ steps.deploy_hosting.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Firestore rules:** no incluidas en este workflow" >> "$GITHUB_STEP_SUMMARY"
