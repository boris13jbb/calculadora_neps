name: calculadora_neps

description: Calculadora VICUNHA de Neps dividido para 0.09 m con exportacion PDF, CSV, Excel e impresion.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  shared_preferences_windows: ^2.4.1
  pdf: 3.11.1
  printing: 5.13.4
  excel: 4.0.6
  path_provider: ^2.1.5
  path_provider_windows: ^2.3.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
